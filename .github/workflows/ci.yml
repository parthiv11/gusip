name: security-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/app --select E9,F
      - run: pip install pip-audit
      - name: Python dependency audit (advisory — see known findings before making this blocking)
        # Currently non-blocking: backend/requirements.txt has ~49 known CVEs across
        # starlette/cryptography/python-jose/python-multipart/orjson/pytest/ecdsa as of
        # this writing. Fix those and drop continue-on-error to make this a real gate.
        continue-on-error: true
        run: pip-audit --requirement backend/requirements.txt
      - name: Build hardened backend
        run: docker build --tag gusip-backend:ci backend
      - name: Run backend tests
        run: docker run --rm gusip-backend:ci python -m pytest

  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --error --config auto backend frontend/src
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
