name: security-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gusip
          POSTGRES_PASSWORD: gusip
          POSTGRES_DB: gusip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gusip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gusip:gusip@localhost:5432/gusip
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/app --select E9,F
      - run: pip install pip-audit
      - name: Python dependency audit (advisory — see known findings before making this blocking)
        # Non-blocking: check current findings (pip-audit --requirement backend/requirements.txt)
        # before dropping continue-on-error to make this a real gate.
        continue-on-error: true
        run: pip-audit --requirement backend/requirements.txt
      - name: Build hardened backend
        run: docker build --tag gusip-backend:ci backend
      - name: Migrate and seed test database
        # app.seed creates the demo users (incl. `operator`) the login-flow
        # integration test authenticates as — normally run by docker-compose's
        # backend startup command, not the app's own lifespan.
        run: >
          docker run --rm --network host
          -e DATABASE_URL=$TEST_DATABASE_URL
          gusip-backend:ci sh -c "python wait_for_db.py && alembic upgrade head && python -m app.seed"
      - name: Run backend tests
        # --network host: the test suite (test_core.py's retention/HTTP integration
        # tests) needs a real Postgres + Redis, not the mocks/pure-unit style the
        # rest of the suite uses — reach the services bound to the runner's localhost.
        run: >
          docker run --rm --network host
          -e DATABASE_URL=$TEST_DATABASE_URL
          -e REDIS_URL=$TEST_REDIS_URL
          gusip-backend:ci python -m pytest

  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --error --config auto backend frontend/src
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
