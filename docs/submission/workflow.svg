<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860">
  <rect width="1400" height="860" fill="#f4f0e6"/>
  <text x="48" y="42" fill="#3d2e0f" font-family="Georgia, serif" font-size="24">Stolen Fortuner, six minutes, five cameras</text>
  <text x="48" y="68" fill="#5c4a28" font-family="system-ui" font-size="14">GJ 01 ST 0001 — Paldi / SG Highway / Thaltej / Gandhinagar. Same steps if the plate is on a Sentinel gov feed.</text>
  <text x="1352" y="42" text-anchor="end" fill="#8a7a5a" font-family="system-ui" font-size="12">workflow</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#3d2e0f"/>
    </marker>
  </defs>

  <!-- Steps -->
  <rect x="40" y="96" width="200" height="120" rx="8" fill="#3d2e0f"/>
  <text x="140" y="128" text-anchor="middle" fill="#c9a227" font-family="system-ui" font-size="12">STEP 1</text>
  <text x="140" y="154" text-anchor="middle" fill="#f4f0e6" font-family="system-ui" font-size="14" font-weight="600">Camera sees it</text>
  <text x="140" y="176" text-anchor="middle" fill="#e8d9a8" font-family="system-ui" font-size="12">AMD-SG-01</text>
  <text x="140" y="196" text-anchor="middle" fill="#c9a227" font-family="system-ui" font-size="12">or SEN-1 Bridge</text>

  <line x1="240" y1="156" x2="268" y2="156" stroke="#3d2e0f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="270" y="96" width="200" height="120" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="370" y="128" text-anchor="middle" fill="#6b4f12" font-family="system-ui" font-size="12">STEP 2</text>
  <text x="370" y="154" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Grab one still</text>
  <text x="370" y="176" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">ffmpeg / stream proxy</text>
  <text x="370" y="196" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="12">not the whole night</text>

  <line x1="470" y1="156" x2="498" y2="156" stroke="#3d2e0f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="500" y="96" width="200" height="120" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="600" y="128" text-anchor="middle" fill="#6b4f12" font-family="system-ui" font-size="12">STEP 3</text>
  <text x="600" y="154" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Read the plate</text>
  <text x="600" y="176" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">Tesseract or YOLOv8n</text>
  <text x="600" y="196" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="12">GJ 01 ST 0001</text>

  <line x1="700" y1="156" x2="728" y2="156" stroke="#3d2e0f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="730" y="96" width="200" height="120" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="830" y="128" text-anchor="middle" fill="#6b4f12" font-family="system-ui" font-size="12">STEP 4</text>
  <text x="830" y="154" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Match watchlist</text>
  <text x="830" y="176" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">stolen / blacklist / wanted</text>
  <text x="830" y="196" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="12">same camera = xN</text>

  <line x1="930" y1="156" x2="958" y2="156" stroke="#3d2e0f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="960" y="96" width="200" height="120" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="1060" y="128" text-anchor="middle" fill="#6b4f12" font-family="system-ui" font-size="12">STEP 5</text>
  <text x="1060" y="154" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Pin the map</text>
  <text x="1060" y="176" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">yellow badge + still</text>
  <text x="1060" y="196" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="12">PostGIS + Leaflet</text>

  <line x1="1160" y1="156" x2="1188" y2="156" stroke="#3d2e0f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1190" y="96" width="170" height="120" rx="8" fill="#3d2e0f"/>
  <text x="1275" y="128" text-anchor="middle" fill="#c9a227" font-family="system-ui" font-size="12">STEP 6</text>
  <text x="1275" y="154" text-anchor="middle" fill="#f4f0e6" font-family="system-ui" font-size="14" font-weight="600">Wall jumps</text>
  <text x="1275" y="176" text-anchor="middle" fill="#e8d9a8" font-family="system-ui" font-size="12">large pane + chime</text>
  <text x="1275" y="196" text-anchor="middle" fill="#c9a227" font-family="system-ui" font-size="12">operator acks</text>

  <!-- Corridor -->
  <text x="48" y="260" fill="#8a7a5a" font-family="system-ui" font-size="11" letter-spacing="1.4">THE HOPS THE DEMO FIRES</text>
  <rect x="40" y="276" width="1320" height="88" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="700" y="312" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="16" font-weight="600">AMD-SG-01   then   AMD-SG-02   then   AMD-TH-01   then   GNR-HW-01   then   GNR-IN-01</text>
  <text x="700" y="342" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="13">docker compose exec worker python -m app.workers.demo_scenario    ·    inbox under 8 seconds</text>

  <!-- Investigate -->
  <text x="48" y="404" fill="#8a7a5a" font-family="system-ui" font-size="11" letter-spacing="1.4">AFTER THE CHASE — RECONSTRUCT</text>
  <rect x="40" y="420" width="310" height="100" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="195" y="456" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Purpose first</text>
  <text x="195" y="480" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">stolen vehicle / evaluation / …</text>
  <text x="195" y="500" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="12">no purpose, no search</text>
  <line x1="350" y1="470" x2="378" y2="470" stroke="#3d2e0f" stroke-width="2" marker-end="url(#a)"/>
  <rect x="380" y="420" width="310" height="100" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="535" y="456" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Plate search</text>
  <text x="535" y="480" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">GJ 01 ST 0001</text>
  <text x="535" y="500" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="12">scoped to home district unless glass</text>
  <line x1="690" y1="470" x2="718" y2="470" stroke="#3d2e0f" stroke-width="2" marker-end="url(#a)"/>
  <rect x="720" y="420" width="310" height="100" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="875" y="456" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Orange line on GIS</text>
  <text x="875" y="480" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">five hops, two cities</text>
  <text x="875" y="500" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="12">click a pin for the still</text>
  <line x1="1030" y1="470" x2="1058" y2="470" stroke="#3d2e0f" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1060" y="420" width="300" height="100" rx="8" fill="#3d2e0f"/>
  <text x="1210" y="456" text-anchor="middle" fill="#c9a227" font-family="system-ui" font-size="14" font-weight="600">Case + audit</text>
  <text x="1210" y="480" text-anchor="middle" fill="#f4f0e6" font-family="system-ui" font-size="12">who searched, why, IP, time</text>
  <text x="1210" y="500" text-anchor="middle" fill="#c9a227" font-family="system-ui" font-size="12">operator cannot export CSV</text>

  <!-- Integrations honest -->
  <text x="48" y="560" fill="#8a7a5a" font-family="system-ui" font-size="11" letter-spacing="1.4">WHAT IS LIVE VS WHAT WE DID NOT FAKE</text>
  <rect x="40" y="576" width="640" height="160" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="64" y="608" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Wired today</text>
  <text x="64" y="636" fill="#5c4a28" font-family="system-ui" font-size="13">Sentinel catalog, state, progressive stream</text>
  <text x="64" y="658" fill="#5c4a28" font-family="system-ui" font-size="13">OpenStreetMap tiles (not Google Maps)</text>
  <text x="64" y="680" fill="#5c4a28" font-family="system-ui" font-size="13">GUSIP REST + WebSocket  /api/v1  /ws/alerts</text>
  <text x="64" y="702" fill="#5c4a28" font-family="system-ui" font-size="13">RTSP / ONVIF / vendor_api adapters + Tesseract</text>
  <text x="64" y="720" fill="#8a7a5a" font-family="system-ui" font-size="12">YOLOv8n when ultralytics is installed</text>

  <rect x="700" y="576" width="660" height="160" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="724" y="608" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Sockets only — no live query</text>
  <text x="724" y="636" fill="#5c4a28" font-family="system-ui" font-size="13">VAHAN / SARTHI  — needs transport MoU</text>
  <text x="724" y="658" fill="#5c4a28" font-family="system-ui" font-size="13">eGujCop FIR bind  — needs department mTLS</text>
  <text x="724" y="680" fill="#5c4a28" font-family="system-ui" font-size="13">AFIS / NAFIS  — no bulk face dump</text>
  <text x="724" y="712" fill="#8a7a5a" font-family="system-ui" font-size="12">We would rather show an empty socket than a fake lookup.</text>

  <text x="48" y="780" fill="#3d2e0f" font-family="system-ui" font-size="14">If Surat NVR dies, Surat cameras go grey. Ahmedabad and Sentinel keep playing. Break-glass dies when the Redis clock says so.</text>
  <text x="48" y="808" fill="#8a7a5a" font-family="system-ui" font-size="12">Blacklist demo plate GJ 05 BL 9999 (Surat). Jury plate: add it on Watchlist, leave Gov feeds running, wait for the ANPR sampler.</text>
  <text x="48" y="832" fill="#8a7a5a" font-family="system-ui" font-size="12">GUSIP does not replace departmental VMS. Full bitstream is not copied to Gandhinagar.</text>
</svg>
