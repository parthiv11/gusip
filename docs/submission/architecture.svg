  <text x="941" y="452" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="13">clips, alerts  not 24�7 video</text>
  <text x="941" y="474" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">NFR-6</text>

