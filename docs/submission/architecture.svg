<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <rect width="1400" height="780" fill="#f4f0e6"/>
  <text x="48" y="44" fill="#3d2e0f" font-family="Georgia, serif" font-size="24">GUSIP — video stays local, hits go statewide</text>
  <text x="48" y="70" fill="#5c4a28" font-family="system-ui, sans-serif" font-size="14">Gujarat Police Innovation Challenge 2026. Not a new NVR. Read cameras, publish events, alert the wall.</text>
  <text x="1352" y="44" text-anchor="end" fill="#8a7a5a" font-family="system-ui" font-size="12">architecture</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#3d2e0f"/>
    </marker>
  </defs>

  <!-- Row 1: sources -->
  <text x="48" y="108" fill="#8a7a5a" font-family="system-ui" font-size="11" letter-spacing="1.4">1  CAMERAS ALREADY ON THE ROAD</text>
  <rect x="48" y="120" width="200" height="86" rx="8" fill="#fff" stroke="#c9a227" stroke-width="1.5"/>
  <text x="148" y="154" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Sentinel wall</text>
  <text x="148" y="176" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">Chimanbhai Bridge</text>
  <text x="148" y="194" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="11">live.sentinelgujarat.in</text>

  <rect x="268" y="120" width="200" height="86" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="368" y="154" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Police / Traffic NVR</text>
  <text x="368" y="176" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">SG Highway, Paldi</text>
  <text x="368" y="194" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="11">24x7 video stays here</text>

  <rect x="488" y="120" width="200" height="86" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="588" y="154" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">AMC / highway</text>
  <text x="588" y="176" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">ONVIF or vendor API</text>
  <text x="588" y="194" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="11">no PTZ from GUSIP</text>

  <rect x="708" y="120" width="200" height="86" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="808" y="154" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Railway / coastal</text>
  <text x="808" y="176" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">same adapter pattern</text>
  <text x="808" y="194" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="11">department owns disk</text>

  <rect x="928" y="120" width="424" height="86" rx="8" fill="#3d2e0f"/>
  <text x="1140" y="154" text-anchor="middle" fill="#f3e6b8" font-family="system-ui" font-size="15" font-weight="600">GUSIP does not copy the movie</text>
  <text x="1140" y="178" text-anchor="middle" fill="#e8d9a8" font-family="system-ui" font-size="13">We take a still + plate + GPS when it matters</text>
  <text x="1140" y="196" text-anchor="middle" fill="#c9a227" font-family="system-ui" font-size="12">read-only adapters</text>

  <!-- Arrow down -->
  <line x1="148" y1="206" x2="148" y2="248" stroke="#3d2e0f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="368" y1="206" x2="368" y2="248" stroke="#3d2e0f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="588" y1="206" x2="588" y2="248" stroke="#3d2e0f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="808" y1="206" x2="808" y2="248" stroke="#3d2e0f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Row 2: what we extract -->
  <text x="48" y="272" fill="#8a7a5a" font-family="system-ui" font-size="11" letter-spacing="1.4">2  ONE EVENT, ANY SOURCE</text>
  <rect x="48" y="284" width="1304" height="100" rx="8" fill="#fff" stroke="#3d2e0f" stroke-width="1.5"/>
  <text x="700" y="322" text-anchor="middle" fill="#3d2e0f" font-family="ui-monospace, monospace" font-size="15">GJ 01 ST 0001   |   AMD-SG-01 SG Highway   |   94%   |   snapshot.jpg   |   23.04 N, 72.51 E</text>
  <text x="700" y="352" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="13">Same JSON whether the frame came from Sentinel, an RTSP NVR, ONVIF, or the PoC simulator.</text>
  <text x="700" y="372" text-anchor="middle" fill="#8a7a5a" font-family="system-ui" font-size="12">ffmpeg still  ·  Tesseract / YOLOv8n  ·  Redis bus  ·  PostGIS pin</text>

  <line x1="700" y1="384" x2="700" y2="424" stroke="#3d2e0f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Row 3: split match vs reconstruct -->
  <text x="48" y="448" fill="#8a7a5a" font-family="system-ui" font-size="11" letter-spacing="1.4">3  TWO ROOMS, ONE BUS</text>
  <rect x="48" y="460" width="620" height="170" rx="8" fill="#3d2e0f"/>
  <text x="72" y="492" fill="#c9a227" font-family="system-ui" font-size="13" font-weight="600">WATCHLIST HIT</text>
  <text x="72" y="520" fill="#f4f0e6" font-family="system-ui" font-size="14">If the plate is on the list, open one card per camera.</text>
  <text x="72" y="542" fill="#f4f0e6" font-family="system-ui" font-size="14">Repeats become x27 — not 27 cards.</text>
  <text x="72" y="564" fill="#f4f0e6" font-family="system-ui" font-size="14">Wall auto-focuses. Map pin turns yellow with the count.</text>
  <text x="72" y="598" fill="#c9a227" font-family="system-ui" font-size="13">Target on AMD to GNR corridor: under 8 seconds</text>

  <rect x="732" y="460" width="620" height="170" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="756" y="492" fill="#6b4f12" font-family="system-ui" font-size="13" font-weight="600">INVESTIGATE</text>
  <text x="756" y="520" fill="#3d2e0f" font-family="system-ui" font-size="14">Officer must pick a purpose before search runs.</text>
  <text x="756" y="542" fill="#3d2e0f" font-family="system-ui" font-size="14">GIS draws the hops. Case folder takes the stills.</text>
  <text x="756" y="564" fill="#3d2e0f" font-family="system-ui" font-size="14">Operators cannot export. IO / coordinator / admin can.</text>
  <text x="756" y="598" fill="#6b4f12" font-family="system-ui" font-size="13">Ahmedabad coordinator: home cameras until break-glass</text>

  <!-- Footer stores -->
  <text x="48" y="668" fill="#8a7a5a" font-family="system-ui" font-size="11" letter-spacing="1.4">4  WHERE THE BYTES LIVE</text>
  <rect x="48" y="680" width="420" height="72" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="258" y="710" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">PostgreSQL + PostGIS</text>
  <text x="258" y="732" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">cameras, tracks, alerts, audit, coverage gaps</text>
  <rect x="490" y="680" width="420" height="72" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="700" y="710" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">Redis</text>
  <text x="700" y="732" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">live boxes, alert fan-out, 30-min break-glass TTL</text>
  <rect x="932" y="680" width="420" height="72" rx="8" fill="#fff" stroke="#3d2e0f"/>
  <text x="1142" y="710" text-anchor="middle" fill="#3d2e0f" font-family="system-ui" font-size="14" font-weight="600">MinIO</text>
  <text x="1142" y="732" text-anchor="middle" fill="#5c4a28" font-family="system-ui" font-size="12">encrypted stills and short clips only</text>
</svg>
