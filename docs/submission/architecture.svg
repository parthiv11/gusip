  <text x="40" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Hybrid: Model 1 registry/GIS + Model 2 unified viewing + Model 3 federation. Not Model 4 (no central VMS replacement).</text>
  <text x="1360" y="42" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Gujarat Police Innovation Challenge 2026</text>

