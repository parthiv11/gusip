apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gusip
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: gusip-backend:poc
          envFrom:
            - configMapRef: { name: gusip-config }
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: gusip-secrets, key: SECRET_KEY }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gusip
spec:
  selector: { app: backend }
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: gusip
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: gusip-backend:poc
          command: ["python", "-m", "app.workers.main"]
          envFrom:
            - configMapRef: { name: gusip-config }
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: gusip-secrets, key: SECRET_KEY }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gusip
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: gusip-frontend:poc
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gusip
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gusip
  namespace: gusip
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: gusip.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
