apiVersion: v1
kind: Namespace
metadata:
  name: gusip
---
apiVersion: v1
kind: Secret
metadata:
  name: gusip-secrets
  namespace: gusip
type: Opaque
stringData:
  SECRET_KEY: change-me-in-production-use-openssl-rand-hex-32
  POSTGRES_PASSWORD: gusip
  MINIO_SECRET: gusipsecret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gusip-config
  namespace: gusip
data:
  DATABASE_URL: postgresql+asyncpg://gusip:gusip@postgres:5432/gusip
  REDIS_URL: redis://redis:6379/0
  SIMULATION_ENABLED: "true"
  INFERENCE_MODE: simulate
