apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: gusip
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          env:
            - name: POSTGRES_USER
              value: gusip
            - name: POSTGRES_DB
              value: gusip
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: gusip-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gusip"]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gusip
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: gusip
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gusip
spec:
  selector: { app: redis }
  ports:
    - port: 6379
